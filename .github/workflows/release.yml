name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'module.json'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      version-changed: ${{ steps.check-version.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: get-version
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: check-version
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            # Root commit has no parent to diff against; treat as changed
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "No parent commit; treating version as changed"
            exit 0
          fi
          git diff HEAD^ HEAD -- module.json > diff.txt
          if grep -q '"version"' diff.txt; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version change detected"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get module info
        id: module-info
        run: |
          VERSION=$(jq -r '.version' module.json)
          TITLE=$(jq -r '.title' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "Preparing release for $TITLE v$VERSION"

      - name: Stamp manifest and download URLs
        run: |
          # Foundry needs these so "Install via Manifest URL" and auto-update work
          jq --arg manifest "https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
             --arg download "https://github.com/${{ github.repository }}/releases/download/v${{ steps.module-info.outputs.version }}/module.zip" \
             '.manifest = $manifest | .download = $download' \
             module.json > module.json.tmp && mv module.json.tmp module.json
          jq '{manifest, download}' module.json

      - name: Create module.zip
        run: |
          # Package only essential module files that exist in this version
          CANDIDATES="module.json README.md CHANGELOG.md LICENSE scripts styles templates lang assets packs dist"
          INCLUDE=""
          for f in $CANDIDATES; do
            [ -e "$f" ] && INCLUDE="$INCLUDE $f"
          done
          zip -r module.zip $INCLUDE

          # Verify the zip was created
          ls -lh module.zip
          echo "Module packaged successfully"

          # Show contents
          echo "Contents of module.zip:"
          unzip -l module.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.module-info.outputs.version }}
          name: ${{ steps.module-info.outputs.title }} v${{ steps.module-info.outputs.version }}
          body: |
            ## ${{ steps.module-info.outputs.title }} v${{ steps.module-info.outputs.version }}

            ### Installation
            Install this version using the following manifest URL:
            ```
            https://github.com/${{ github.repository }}/releases/download/v${{ steps.module-info.outputs.version }}/module.json
            ```

            Or download `module.zip` and install manually.

            ### Compatibility
            - Foundry VTT v11–v14

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          files: |
            module.zip
            module.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release links
        run: |
          echo "Release created successfully!"
          echo "Download URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.module-info.outputs.version }}/module.zip"
          echo "Manifest URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.module-info.outputs.version }}/module.json"
